name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - review_requested

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os.name }}
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Ubuntu
            id: ubuntu
            runner: ubuntu-latest

          - name: macOS
            id: macos
            runner: macos-latest

          - name: Windows Git Bash
            id: windows-gitbash
            runner: windows-latest

          - name: Windows MSYS2
            id: windows-msys2
            runner: windows-latest

          - name: Windows Cygwin
            id: windows-cygwin
            runner: windows-latest

    steps:
      - if: ${{ matrix.os.id == 'windows-msys2' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      - if: ${{ matrix.os.id == 'windows-cygwin' }}
        uses: cygwin/cygwin-install-action@v7

      - uses: actions/checkout@v7

      - uses: $/
        with:
          artifact-suffix: ${{ format('_{0}', matrix.os.id) }}
          shell: bash
          kcov: true
