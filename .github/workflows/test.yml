name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os.name }}
    strategy:
      matrix:
        os:
          - name: Ubuntu
            suffix: ubuntu
            runner: ubuntu-latest

          - name: macOS
            suffix: macos
            runner: macos-latest

          - name: Windows Git Bash
            suffix: windows-gitbash
            runner: windows-latest

          - name: Windows MSYS2
            suffix: windows-msys2
            runner: windows-latest

          - name: Windows Cygwin
            suffix: windows-cygwin
            runner: windows-latest

      fail-fast: false
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v7

      - if: ${{ matrix.os.suffix == 'windows-msys2' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      - if: ${{ matrix.os.suffix == 'windows-cygwin' }}
        uses: cygwin/cygwin-install-action@v7

      - uses: $/
        with:
          artifact-suffix: ${{ format('_{0}', matrix.os.suffix) }}
          shell: bash
          kcov: true
