name: Windows Cygwin Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows Cygwin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cygwin/cygwin-install-action@v7
      - uses: $/
        with:
          artifact-suffix: "_windows-cygwin"
          shell: bash
          kcov: true
